[package]
name = "parquet-viewer"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A native macOS viewer for Parquet and delimited text files built with Rust and GPUI"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
arrow = { version = "=58.4.1", features = ["ipc", "json", "ffi"] }
parquet = { version = "=58.4.1", features = ["arrow_canonical_extension_types"] }
datafusion = { version = "=54.1.0", default-features = false, features = ["nested_expressions", "datetime_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "math_expressions", "sql", "recursive_protection"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
unicode-segmentation = "1"
csv = "1"
tempfile = "3"
rust_xlsxwriter = { version = "0.90", features = ["constant_memory"] }
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
objc = "0.2.7"
raw-window-handle = "=0.6.2"
log = "0.4"
arrow-ipc = "=58.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
mimalloc = { version = "=0.1.48", default-features = false, features = ["v3"] }
libmimalloc-sys = { version = "=0.1.44", default-features = false, features = ["extended", "v3"] }

[dev-dependencies]
bytes = "1"
calamine = "0.31"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
gpui = { path = "vendor/gpui" }
